  <!DOCTYPE html>
  <!-- Created by CodingLab |www.youtube.com/c/CodingLabYT-->
  <html lang="en" dir="ltr">
    <head>
      <meta charset="UTF-8">
      <!--<title> Login and Registration Form in HTML & CSS | CodingLab </title>-->
      <link rel="stylesheet" href="style.css">
      <!-- Fontawesome CDN Link -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
      <script src="main.js" defer type="module"></script>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style></style>
  <body>
    <img  class="back-img" src="images/bg.avif">
    <div class="container">
    <input type="checkbox" id="flip">
    <div class="cover">
      <div class="front">
        <img src="images/Login_img.png" alt="">
        
      </div>
      <div class="back">
        <img class="backImg" src="images/plant.jpg" alt="">
        <div class="text">
          <span class="text-1">Complete miles of journey <br> with one step</span>
          <span class="text-2">Let's get started</span>
        </div>
      </div>
    </div>
    
    <div class="forms">
        <div class="form-content">
          <div class="login-form">
            <div class="title"><img src="images/logobg.png" width="50px; height:50px;">Login</div>
          <form action="http://localhost:5000/login" method="POST">
            <div class="input-boxes">
              <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="text" placeholder="Enter your email" required>
              </div>
              <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Enter your password" required>
              </div>
              <div> <input type="checkbox">  Remember Me</div>
              <div class="button input-box">
                <input type="submit" value="Sumbit" href="http://localhost:8501/">
              </div>
              <div class="input">
                <button id="google-Login-btn" class="google-button" style="color: white;background:red; width:368px;height:50px; border-radius:15px;">
                  <i class="fab fa-google"></i>Login With Google
                </button>
              </div>
              <div class="text sign-up-text">Don't have an account? <label for="flip">Sigup now</label></div>
            </div>
        </form>
      </div>
        <div class="signup-form">
          <div class="title"><img src="images/logobg.png" width="50px; height:50px;">Signup</div>
        <form action="#">
            <div class="input-boxes">
              <div class="input-box">
                <i class="fas fa-user"></i>
                <input type="text" placeholder="Enter your name" required>
              </div>
              <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="text" placeholder="Enter your email" required>
              </div>
              <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Enter your password" required>
              </div>
              <div class="button input-box">
                <label for="flip"></label><input type="submit" value="Sumbit" ></label>
              </div>
              <div class="text sign-up-text">Already have an account?<label for="flip">Login now</label></div>
            </div>
      </form>
    </div>
    </div>
    </div>
  </div>
</body>
</html>
